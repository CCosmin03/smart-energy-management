spring.application.name=auth-service

###############################################
### DATABASE CONFIGURATION ###
###############################################
database.ip=${DB_IP:localhost}
database.port=${DB_PORT:5432}
database.user=${DB_USER}
database.password=${DB_PASSWORD}
database.name=${DB_DBNAME:auth_db}

spring.datasource.url=jdbc:postgresql://${database.ip}:${database.port}/${database.name}?sslmode=disable
spring.datasource.username=${database.user}
spring.datasource.password=${database.password}

spring.sql.init.platform=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


###############################################
### JWT CONFIGURATION ###
###############################################

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000}

###############################################
### SERVER CONFIGURATION ###
###############################################
server.port=${PORT:8083}

###############################################
### LOGGING CONFIGURATION ###
###############################################
logging.level.root=warn
logging.level.org.springframework=warn
logging.level.com.example.auth=info

###############################################
### CORS CONFIGURATION ###
###############################################
spring.mvc.cors.mappings.[/**].allowed-origins=*
spring.mvc.cors.mappings.[/**].allowed-methods=*
spring.mvc.cors.mappings.[/**].allowed-headers=*

http:
  middlewares:
    strip-api-prefix:
      stripPrefix:
        prefixes: ["/api"]

    auth-forward:
      forwardAuth:
        address: "http://auth-service:8083/auth/verify"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-User-Id"
          - "X-User-Role"

  routers:
    # Public
    auth-public:
      rule: "PathPrefix(`/auth/login`) || PathPrefix(`/auth/register`)"
      entryPoints: [ "web" ]
      service: auth-svc

    verify:
      rule: "PathPrefix(`/auth/verify`)"
      entryPoints: [ "web" ]
      service: auth-svc

    # Protected
    users:
      rule: "PathPrefix(`/users`)"
      entryPoints: [ "web" ]
      middlewares: [ "auth-forward" ]
      service: user-svc

    devices:
      rule: "PathPrefix(`/devices`) || PathPrefix(`/assignments`)"
      entryPoints: [ "web" ]
      middlewares: [ "auth-forward" ]
      service: device-svc

    monitoring:
      rule: "PathPrefix(`/monitoring`)"
      entryPoints: [ "web" ]
      middlewares: [ "auth-forward" ]
      service: monitoring-svc

  services:
    auth-svc:
      loadBalancer:
        servers:
          - url: "http://auth-service:8083"

    user-svc:
      loadBalancer:
        servers:
          - url: "http://user-service:8081"

    device-svc:
      loadBalancer:
        servers:
          - url: "http://device-service:8082"

    monitoring-svc:
      loadBalancer:
        servers:
          - url: "http://monitoring-service:8084"

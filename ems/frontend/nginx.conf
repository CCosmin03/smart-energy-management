server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Rutele React (SPA fallback)
  location / {
    try_files $uri /index.html;
  }

  # Cache static pentru vite build
  location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|woff2?)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public";
  }
}

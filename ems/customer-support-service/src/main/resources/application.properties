spring.application.name=customer-support-service
server.port=8086

# ===============================
# WebSocket Service integration
# ===============================
websocket.service.url=${WEBSOCKET_SERVICE_URL:http://websocket-service:8085}

# ===============================
# Logging
# ===============================
logging.level.org.springframework.web=INFO
logging.level.com.example.customersupport=DEBUG

ollama.base-url=${OLLAMA_BASE_URL:http://ollama:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:1b}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:200}
chat.rules.enabled=${CHAT_RULES_ENABLED:false}


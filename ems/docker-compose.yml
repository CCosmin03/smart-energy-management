version: "3.9"

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
      - device-service
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [ ems ]

  # === Databases ===
  auth-db:
    image: postgres:18
    container_name: auth-db
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: auth_db
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks: [ ems ]

  user-db:
    image: postgres:18
    container_name: user-db
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: user_db
    volumes:
      - user_pgdata:/var/lib/postgresql/data
    networks: [ ems ]

  device-db:
    image: postgres:18
    container_name: device-db
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: device_db
    volumes:
      - device_pgdata:/var/lib/postgresql/data
    networks: [ ems ]

  auth-service:
    build: ./auth-service
    container_name: auth-service
    env_file:
      - ./.env
    environment:
      PORT: ${AUTH_PORT:-8083}
      DB_IP: auth-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DBNAME: auth_db
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC"
    depends_on: [ auth-db ]
    expose:
      - "${AUTH_PORT:-8083}"
    networks: [ ems ]

  user-service:
    build: ./user-service
    container_name: user-service
    env_file:
      - ./.env
    environment:
      PORT: ${USER_PORT:-8081}
      DB_IP: user-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DBNAME: user_db
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC"
    depends_on: [ user-db ]
    expose:
      - "${USER_PORT:-8081}"
    networks: [ ems ]

  device-service:
    build: ./device-service
    container_name: device-service
    env_file:
      - ./.env
    environment:
      PORT: ${DEVICE_PORT:-8082}
      DB_IP: device-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DBNAME: device_db
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC"
    depends_on: [ device-db ]
    expose:
      - "${DEVICE_PORT:-8082}"
    networks: [ ems ]

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks: [ ems ]

networks:
  ems:

volumes:
  auth_pgdata:
  user_pgdata:
  device_pgdata:

spring.application.name=user-service

###############################################
### DATABASE CONFIGURATION ###
###############################################
database.ip=${DB_IP:localhost}
database.port=${DB_PORT:5432}
database.user=${DB_USER}
database.password=${DB_PASSWORD}
database.name=${DB_DBNAME:user_db}

spring.datasource.url=jdbc:postgresql://${database.ip}:${database.port}/${database.name}?sslmode=disable
spring.datasource.username=${database.user}
spring.datasource.password=${database.password}

spring.sql.init.platform=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}


spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=20
spring.rabbitmq.listener.simple.retry.initial-interval=3000
spring.rabbitmq.listener.simple.retry.multiplier=1.5
spring.rabbitmq.listener.simple.retry.max-interval=15000

spring.rabbitmq.connection-timeout=60000


###############################################
### JWT CONFIGURATION ###
###############################################
app.jwt.secret=${APP_JWT_SECRET}

###############################################
### SERVER CONFIGURATION ###
###############################################
server.port=${PORT:8081}

###############################################
### LOGGING CONFIGURATION ###
###############################################
logging.level.root=warn
logging.level.org.springframework=warn
logging.level.com.example.user=info

###############################################
### CORS CONFIGURATION ###
###############################################
spring.mvc.cors.mappings.[/**].allowed-origins=*
spring.mvc.cors.mappings.[/**].allowed-methods=*
spring.mvc.cors.mappings.[/**].allowed-headers=*

